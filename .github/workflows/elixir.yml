name: Elixir

on: push

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: elixir:1.14

    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y build-essential erlang-xmerl

      - name: Install Dependencies
        run: |
          mix local.rebar --force
          mix local.hex --force
          mix deps.get
      - name: Run Tests
        run: mix test
